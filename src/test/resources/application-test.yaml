# 운영과 같은 PostgreSQL 을 Testcontainers 로 띄워(Docker 필요) 같은 Flyway 마이그레이션을 적용하고
# ddl-auto validate 로 엔티티와 대조한다. .env 없이 돌도록 비밀 값은 더미를 쓴다
spring:
  datasource:
    url: jdbc:tc:postgresql:17:///ijiri
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  mail:
    username: test@ijiri.com
    password: test

jwt:
  secret: test-secret-key-0123456789abcdef-0123456789

oauth:
  kakao:
    app-id: 0
    admin-key: test
  google:
    client-ids: test-client-id

cors:
  allowed-origins: http://localhost:3000

storage:
  local:
    base-dir: ${java.io.tmpdir}/ijiri-test-uploads
  public-base-url: http://localhost
