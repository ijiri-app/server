spring:
  application:
    name: IjiriServer

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # Gmail 은 계정 비밀번호가 아니라 앱 비밀번호
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:ijiri-local-test-secret-key-0123456789abcdef}
  access-token-validity-seconds: 3600 # 1시간
  refresh-token-validity-seconds: 2419200 # 28일

oauth:
  kakao:
    app-id: ${KAKAO_APP_ID:0}
    # 회원 탈퇴 시 카카오 연결 끊기 API 호출용 (콘솔 > 앱 키 > Admin 키)
    admin-key: ${KAKAO_ADMIN_KEY:}
  google:
    # Android/iOS/Web 클라이언트 ID 를 콤마로 구분해서 모두 넣는다 (ID token 의 aud 검증용)
    client-ids: ${GOOGLE_CLIENT_IDS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
