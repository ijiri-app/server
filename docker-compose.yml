# 운영 구성: 서비스별 PostgreSQL 4개 + Kafka + Spring 서비스 4개(각각 blue/green) + nginx + Cloudflare Tunnel.
# 공인 IP·포트포워딩 없이 cloudflared 가 Cloudflare 로 나가는 연결을 맺고, api 도메인 요청을 nginx:80 으로 넘긴다.
# nginx 는 경로별로 서비스에 라우팅하고(게이트웨이), 요청마다 service-user 에 토큰 검증을 맡긴다(auth_request).
# nginx:81 은 서비스끼리 부르는 내부 리스너로, 둘 다 nginx/upstream.conf 가 가리키는 색(blue 또는 green)으로만 보낸다.
# 배포는 ./deploy.sh <이미지 태그> 로 한다 (쉬는 색에 새 버전을 띄우고, 응답하면 nginx 를 돌린 뒤 이전 색을 내린다).
# 서비스는 profile 로 묶어 두어 docker compose up -d 만으로는 뜨지 않는다. 지울 때는 --profile '*' 를 붙인다
# 운영 배포는 main 에 push 하면 GitHub Actions(.github/workflows/ci-cd.yml)가 한다
services:
  db-user: &db
    # 부품 이름 추천에 pgvector 를 붙일 예정이라 pgvector 가 들어간 PostgreSQL 17 이미지를 쓴다
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ijiri_user
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-user-data:/var/lib/postgresql/data
    # 백업(pg_dump)·관리용으로 이 서버에서만 접속할 수 있게 localhost 에만 연다
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-community:
    <<: *db
    environment:
      POSTGRES_DB: ijiri_community
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-community-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  db-car:
    <<: *db
    environment:
      POSTGRES_DB: ijiri_car
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-car-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"

  db-media:
    <<: *db
    environment:
      POSTGRES_DB: ijiri_media
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-media-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"

  # 서비스 간 이벤트(탈퇴, 영구 삭제, 게시물 삭제, 부품 사용 수). KRaft 단일 노드, 홈서버라 힙을 작게 잡는다
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 컨테이너끼리는 kafka:9092, 호스트에서 서비스를 직접 띄울 때는 localhost:19092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
      TZ: Asia/Seoul
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 768m

  # CI 가 GHCR 에 올린 이미지를 쓴다. deploy.sh 가 IMAGE_TAG(sha-<커밋>)를 넘긴다. 로컬에서는 --build 로 직접 빌드.
  # 서비스끼리는 nginx 의 내부 리스너(81)를 거쳐 서비스 중인 색을 부른다.
  # deploy.sh 가 nginx 로 돌리기 전에 호스트 포트로 기동을 확인한다 (blue 808x, green 809x). localhost 에만 연다
  user-blue: &user
    image: ghcr.io/ijiri-app/server-user:${IMAGE_TAG:-main}
    build:
      context: .
      args:
        MODULE: service-user
    profiles: [blue]
    restart: unless-stopped
    env_file: .env
    environment: &service-env
      DB_URL: jdbc:postgresql://db-user:5432/ijiri_user
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://nginx:81/user
      COMMUNITY_SERVICE_URL: http://nginx:81/community
      CAR_SERVICE_URL: http://nginx:81/car
      MEDIA_SERVICE_URL: http://nginx:81/media
    depends_on:
      db-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 512m
    # Spring 의 graceful shutdown(처리 중인 요청 마무리, 최대 30초)이 끝날 때까지 기다린다
    stop_grace_period: 40s

  user-green:
    <<: *user
    profiles: [green]
    ports:
      - "127.0.0.1:8091:8080"

  community-blue: &community
    <<: *user
    image: ghcr.io/ijiri-app/server-community:${IMAGE_TAG:-main}
    build:
      context: .
      args:
        MODULE: service-community
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://db-community:5432/ijiri_community
    depends_on:
      db-community:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"

  community-green:
    <<: *community
    profiles: [green]
    ports:
      - "127.0.0.1:8092:8080"

  car-blue: &car
    <<: *user
    image: ghcr.io/ijiri-app/server-car:${IMAGE_TAG:-main}
    build:
      context: .
      args:
        MODULE: service-car
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://db-car:5432/ijiri_car
    depends_on:
      db-car:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8080"

  car-green:
    <<: *car
    profiles: [green]
    ports:
      - "127.0.0.1:8093:8080"

  media-blue: &media
    <<: *user
    image: ghcr.io/ijiri-app/server-media:${IMAGE_TAG:-main}
    build:
      context: .
      args:
        MODULE: service-media
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://db-media:5432/ijiri_media
    depends_on:
      db-media:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8080"

  media-green:
    <<: *media
    profiles: [green]
    ports:
      - "127.0.0.1:8094:8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # default.conf, proxy.inc 와 deploy.sh 가 만드는 upstream.conf 가 함께 읽힌다
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    # 외부 공개는 터널로만 한다. 8080 은 서비스 중인 버전 확인용, 8090 은 호스트에서 서비스를 직접 띄울 때의 내부 호출용
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8090:81"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  db-user-data:
  db-community-data:
  db-car-data:
  db-media-data:
  kafka-data:
