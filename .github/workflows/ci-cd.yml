# PR 과 push 모두 테스트한다. push 는 테스트와 서비스 4개의 이미지 빌드(GHCR, SHA 태그만)를 동시에 돌리고, 둘 다
# 성공해야 브랜치 태그(develop, main)를 그 이미지로 옮기며 main 은 서버에 배포까지 한다.
# 되돌리기·재배포는 Actions 화면의 Run workflow(workflow_dispatch)에 이미지 태그(sha-<커밋>)를 넣어 실행한다.
# 서버는 Cloudflare Tunnel 뒤에 있어 밖에서 SSH 로 들어갈 수 없으므로, 서버에 설치한 self-hosted runner 가 배포한다.
name: CI/CD

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 배포할 이미지 태그 (예 sha-<커밋>). 되돌리기는 이전 커밋의 태그
        required: true

# 같은 PR 에 새로 push 하면 이전 실행을 취소한다. 브랜치 push 는 취소하지 않는다 (빌드·배포가 중간에 끊기지 않게)
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/server

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 기본값은 main 에서만 캐시를 저장한다. PR 도 저장해야 같은 PR 의 다음 push 가 테스트 의존성과
      # 임베디드 PostgreSQL 바이너리를 다시 받지 않는다
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 모듈마다 임베디드 PostgreSQL 로 돌아서 Docker 가 필요 없다
      - name: Test
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test'

  # 테스트와 동시에 돈다. SHA 태그만 붙이므로, 테스트가 실패한 이미지는 브랜치 태그를 받지도 배포되지도 않는다
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Gradle 캐시를 쓰도록 이미지 밖에서 빌드하고 jar 만 담는다. 모듈 jar 를 한 디렉터리에 모아 컨텍스트로 쓴다
      - name: Build jars
        run: |
          ./gradlew bootJar
          mkdir -p build/jars
          cp service-*/build/libs/*-SNAPSHOT.jar build/jars/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 서비스 4개를 동시에 빌드한다. jar 레이어는 매번 바뀌고 베이스 이미지는 한 빌더 안에서 공유되므로
      # 레이어 캐시(gha)는 내보내는 시간만 들어 쓰지 않는다
      - name: Build and push images
        run: |
          pids=()
          for module in service-user service-community service-car service-media; do
            docker buildx build build/jars \
              --file Dockerfile --target ci --build-arg MODULE="$module" --push \
              --tag "$IMAGE-${module#service-}:sha-${{ github.sha }}" &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

  # 테스트와 빌드가 모두 성공한 커밋만 브랜치 태그를 받는다 (이미지를 다시 받지 않고 매니페스트만 복사한다)
  promote:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images with the branch
        run: |
          for name in user community car media; do
            docker buildx imagetools create \
              --tag "$IMAGE-$name:${{ github.ref_name }}" "$IMAGE-$name:sha-${{ github.sha }}"
          done

  deploy:
    needs: promote
    # main push 이거나 main 에서 수동 실행할 때. 서버에 runner 를 설치하고 저장소 변수 DEPLOY_ENABLED 를 true 로
    # 두기 전까지는 건너뛴다 (runner 가 없으면 작업이 대기하다 실패한다). 수동 실행은 promote 를 건너뛰어도 돈다
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && needs.promote.result == 'success') || github.event_name == 'workflow_dispatch')
    # 서버에 설치한 runner (라벨 ijiri-server)
    runs-on: [self-hosted, ijiri-server]
    environment: production
    # 배포는 한 번에 하나씩, 진행 중인 배포는 취소하지 않는다 (blue/green 전환이 중간에 끊기면 안 된다)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .env, DB 볼륨, 서비스 중인 색(nginx/upstream.conf)은 서버의 DEPLOY_DIR 에 두고 배포 파일만 최신으로 덮어쓴다.
      # deploy.sh 가 쉬는 색에 새 버전을 띄우고, 모두 응답하면 nginx 를 돌린다. 뜨지 못하면 배포를 실패로 표시한다
      - name: Deploy (blue/green)
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
        run: |
          test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR repository variable is not set"; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid image tag: $IMAGE_TAG"; exit 1; }
          mkdir -p "$DEPLOY_DIR/nginx"
          cp docker-compose.yml deploy.sh "$DEPLOY_DIR/"
          cp nginx/default.conf nginx/proxy.inc "$DEPLOY_DIR/nginx/"
          "$DEPLOY_DIR/deploy.sh" "$IMAGE_TAG"
