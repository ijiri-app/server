spring:
  application:
    name: service-user

  # 프로필을 지정하지 않으면 로컬 설정으로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=prod
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # 보내는 사람 주소로도 쓴다 (VerificationMailClient)
    username: ${MAIL_USERNAME}
    # Gmail 은 계정 비밀번호가 아니라 앱 비밀번호
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 465(SSL) 포트만 여는 메일 서버(다음 스마트워크 등)는 MAIL_SSL=true, MAIL_PORT=465
          ssl:
            enable: ${MAIL_SSL:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # 스키마는 Flyway 마이그레이션(db/migration)으로만 바꾼다. Hibernate 는 엔티티와 대조만 한다
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # 인증 메일은 응답 뒤에 applicationTaskExecutor 에서 보낸다 (EmailVerificationService). 종료할 때 보내는 중인 메일을 끝낸다
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 10s

  jackson:
    mapper:
      # provider 를 "kakao" 처럼 소문자로 보내도 enum 으로 받는다
      accept-case-insensitive-enums: true

  # 메시지는 JSON 문자열. member.withdrawn, member.purged 를 발행한다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: service-user
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# 필수 값은 기본값을 두지 않아, 빠지면 기동 시점에 실패한다
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 3600 # 1시간
  refresh-token-validity-seconds: 2419200 # 28일

oauth:
  kakao:
    app-id: ${KAKAO_APP_ID}
    # 회원 탈퇴 시 카카오 연결 끊기 API 호출용 (콘솔 > 앱 키 > Admin 키)
    admin-key: ${KAKAO_ADMIN_KEY}
  google:
    # Android/iOS/Web 클라이언트 ID 를 콤마로 구분해서 모두 넣는다 (ID token 의 aud 검증용)
    client-ids: ${GOOGLE_CLIENT_IDS}

# 발행하는 메시지는 outbox_message 를 거쳐 커밋된 뒤에만 나간다 (OutboxMessagePublisher, OutboxRelay)
messaging:
  outbox:
    enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 다른 서비스의 내부 API 주소. 운영은 nginx 의 내부 리스너(서비스 중인 색으로 라우팅)를 거친다
services:
  car:
    url: ${CAR_SERVICE_URL}
  community:
    url: ${COMMUNITY_SERVICE_URL}
  media:
    url: ${MEDIA_SERVICE_URL}
