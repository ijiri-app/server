# 운영 구성: PostgreSQL + Spring 서버 2벌(blue/green) + nginx + Cloudflare Tunnel.
# 공인 IP·포트포워딩 없이 cloudflared 가 Cloudflare 로 나가는 연결을 맺고, api 도메인 요청을 nginx:80 으로 넘긴다.
# nginx 는 nginx/upstream.conf 가 가리키는 한쪽 색(app-blue 또는 app-green)으로만 보낸다.
# 배포는 ./deploy.sh <이미지 태그> 로 한다 (쉬는 색에 새 버전을 띄우고, 응답하면 nginx 를 돌린 뒤 이전 색을 내린다).
# app-blue / app-green 은 profile 로 묶어 두어 docker compose up -d 만으로는 뜨지 않는다. 지울 때는 --profile '*' 를 붙인다
# 운영 배포는 main 에 push 하면 GitHub Actions(.github/workflows/ci-cd.yml)가 한다
services:
  db:
    # 부품 이름 추천에 pgvector 를 붙일 예정이라 pgvector 가 들어간 PostgreSQL 17 이미지를 쓴다
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    # 백업(pg_dump)·관리용으로 이 서버에서만 접속할 수 있게 localhost 에만 연다
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-blue: &app
    # CI 가 GHCR 에 올린 이미지를 쓴다. deploy.sh 가 IMAGE_TAG(sha-<커밋>)를 넘긴다. 로컬에서는 --build 로 직접 빌드
    image: ghcr.io/ijiri-app/server:${IMAGE_TAG:-main}
    build: .
    profiles: [blue]
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # deploy.sh 가 nginx 로 돌리기 전에 이 포트로 기동을 확인한다. localhost 에만 연다
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 1g
    # Spring 의 graceful shutdown(처리 중인 요청 마무리, 최대 30초)이 끝날 때까지 기다린다
    stop_grace_period: 40s

  app-green:
    <<: *app
    profiles: [green]
    ports:
      - "127.0.0.1:8082:8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # default.conf 와 deploy.sh 가 만드는 upstream.conf 가 함께 읽힌다
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    # 외부 공개는 터널로만 한다. 이 서버에서 지금 서비스 중인 버전을 확인할 수 있게 localhost 에만 연다
    ports:
      - "127.0.0.1:8080:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  db-data:
