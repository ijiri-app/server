# PR 은 테스트만 돌린다. 머지는 PR 의 test 통과와 최신 브랜치가 필수라(브랜치 보호) push 에서는 다시 테스트하지 않고,
# 이미지 빌드(GHCR)만 하며 main 은 서버에 배포까지 한다.
# 서버는 Cloudflare Tunnel 뒤에 있어 밖에서 SSH 로 들어갈 수 없으므로, 서버에 설치한 self-hosted runner 가 배포한다.
name: CI/CD

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 기본값은 main 에서만 캐시를 저장해 develop 과 PR 이 캐시를 받지 못한다
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Testcontainers 가 러너의 Docker 로 PostgreSQL 을 띄운다
      - name: Test
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Gradle 캐시를 쓰도록 이미지 밖에서 빌드하고 jar 만 담는다
      - name: Build jar
        run: ./gradlew bootJar

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 브랜치 이름 태그(develop, main)와 커밋 SHA 태그를 함께 붙인다. 되돌릴 때는 SHA 태그로 띄운다
      - uses: docker/build-push-action@v6
        with:
          context: build/libs
          file: Dockerfile
          target: ci
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 서버에 설치한 runner (라벨 ijiri-server)
    runs-on: [self-hosted, ijiri-server]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .env, DB 볼륨, 서비스 중인 색(nginx/upstream.conf)은 서버의 DEPLOY_DIR 에 두고 배포 파일만 최신으로 덮어쓴다.
      # deploy.sh 가 쉬는 색에 새 버전을 띄우고, 응답하면 nginx 를 돌린다. 뜨지 못하면 배포를 실패로 표시한다
      - name: Deploy (blue/green)
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR repository variable is not set"; exit 1; }
          mkdir -p "$DEPLOY_DIR/nginx"
          cp docker-compose.yml deploy.sh "$DEPLOY_DIR/"
          cp nginx/default.conf "$DEPLOY_DIR/nginx/default.conf"
          "$DEPLOY_DIR/deploy.sh" "$IMAGE_TAG"
