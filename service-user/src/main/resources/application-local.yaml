spring:
  jpa:
    show-sql: true
  # compose 의 db-user 가 호스트에 여는 포트
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ijiri_user}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# 로컬 전용 값. 운영(prod)에서는 환경 변수가 없으면 기동에 실패한다
jwt:
  secret: ${JWT_SECRET:ijiri-local-test-secret-key-0123456789abcdef}

oauth:
  kakao:
    admin-key: ${KAKAO_ADMIN_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# compose 의 nginx 내부 리스너(localhost:8090)를 거쳐 다른 서비스를 부른다
services:
  car:
    url: ${CAR_SERVICE_URL:http://localhost:8090/car}
  community:
    url: ${COMMUNITY_SERVICE_URL:http://localhost:8090/community}
  media:
    url: ${MEDIA_SERVICE_URL:http://localhost:8090/media}
