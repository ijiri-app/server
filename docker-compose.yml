# 운영 구성: Spring 서버 + PostgreSQL + Cloudflare Tunnel.
# 공인 IP·포트포워딩 없이 cloudflared 가 Cloudflare 로 나가는 연결을 맺고, api 도메인 요청을 app:8080 으로 넘긴다.
# 실행: cp .env.example .env 후 값 채우기 -> docker compose up -d (GHCR 이미지) 또는 --build (직접 빌드)
# 운영 배포는 main 에 push 하면 GitHub Actions(.github/workflows/ci-cd.yml)가 한다
services:
  db:
    # 부품 이름 추천에 pgvector 를 붙일 예정이라 pgvector 가 들어간 PostgreSQL 17 이미지를 쓴다
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    # 백업(pg_dump)·관리용으로 이 서버에서만 접속할 수 있게 localhost 에만 연다
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # CI 가 GHCR 에 올린 이미지를 쓴다 (IMAGE_TAG 기본값은 main 브랜치 최신). 로컬에서는 --build 로 직접 빌드
    image: ghcr.io/ijiri-app/server:${IMAGE_TAG:-main}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # 외부 공개는 터널로만 한다. 이 서버에서 직접 확인할 수 있게 localhost 에만 연다
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  db-data:
