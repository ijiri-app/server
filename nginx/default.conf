# upstream user / community / car / media 는 deploy.sh 가 만드는 upstream.conf 에 있다 (서비스 중인 색 하나만 가리킨다).
# 공개 리스너(80): 경로별로 서비스에 라우팅하고, 요청마다 service-user 에 토큰 검증을 맡긴다 (proxy.inc).
# 내부 리스너(81): 서비스끼리 /user, /community, /car, /media 접두사로 서로를 부른다. 호스트에는 127.0.0.1:8090 으로만 연다
server {
    listen 80;

    client_max_body_size 20m;

    # 게이트웨이 인증. service-user 가 토큰(헤더 또는 쿠키)과 세션을 검증해 회원 id 와 DB 의 역할을 응답 헤더로 준다.
    # 토큰이 없거나 유효하지 않아도 200 이고 헤더만 비어, 공개 API 는 비로그인으로 처리된다
    location = /_auth {
        internal;
        proxy_pass http://user/internal/auth/verify;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 내부 API 는 밖에서 부를 수 없다. ^~ 라 아래 정규식 location 보다 먼저 정해진다
    location ^~ /internal/ {
        return 404;
    }

    # 기동 확인(health)은 배포 스크립트가 호스트 포트로만 부른다
    location ^~ /actuator/ {
        return 404;
    }

    # 정규식 location 은 적힌 순서대로 먼저 맞는 것이 이긴다. /members 아래는 서비스가 갈린다
    location ~ ^/members/[^/]+/(posts|block)$ {
        include conf.d/proxy.inc;
        proxy_pass http://community;
    }

    location ~ ^/members/me/(blocks|wishlist)$ {
        include conf.d/proxy.inc;
        proxy_pass http://community;
    }

    location ~ ^/(feed|posts|wishlist|reports|admin)(/|$) {
        include conf.d/proxy.inc;
        proxy_pass http://community;
    }

    location ~ ^/(car-models|parts|brands)(/|$) {
        include conf.d/proxy.inc;
        proxy_pass http://car;
    }

    location ~ ^/(uploads|images)(/|$) {
        include conf.d/proxy.inc;
        proxy_pass http://media;
    }

    # /auth/**, /members/me, /members/me/cars, /members/me/interest-cars, /members/{id}
    location / {
        include conf.d/proxy.inc;
        proxy_pass http://user;
    }
}

# 내부 리스너는 /internal API 만 넘긴다. 회원 헤더는 비워, 내부망에서 공개·관리자 API 를 다른 회원으로 부를 수 없다
server {
    listen 81;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Member-Id "";
    proxy_set_header X-Member-Role "";

    location /user/internal/ {
        proxy_pass http://user/internal/;
    }

    location /community/internal/ {
        proxy_pass http://community/internal/;
    }

    location /car/internal/ {
        proxy_pass http://car/internal/;
    }

    location /media/internal/ {
        proxy_pass http://media/internal/;
    }

    location / {
        return 404;
    }
}
