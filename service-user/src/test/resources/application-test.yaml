# 운영과 같은 PostgreSQL 17 을 임베디드로 띄워(Docker 불필요, @AutoConfigureEmbeddedDatabase) 같은 Flyway
# 마이그레이션을 적용하고 ddl-auto validate 로 엔티티와 대조한다. .env 없이 돌도록 비밀 값은 더미를 쓴다.
# Kafka 와 다른 서비스는 띄우지 않는다 (발행과 내부 호출은 테스트가 목으로 바꾼다)
zonky:
  test:
    database:
      provider: zonky
      type: postgres

spring:
  mail:
    username: test@ijiri.com
    password: test
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

jwt:
  secret: test-secret-key-0123456789abcdef-0123456789

oauth:
  kakao:
    app-id: 0
    admin-key: test
  google:
    client-ids: test-client-id

cors:
  allowed-origins: http://localhost:3000

services:
  car:
    url: http://localhost:1/car
  community:
    url: http://localhost:1/community
  media:
    url: http://localhost:1/media
