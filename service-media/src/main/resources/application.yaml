spring:
  application:
    name: service-media

  # 프로필을 지정하지 않으면 로컬 설정으로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=prod
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway 마이그레이션(db/migration)으로만 바꾼다. Hibernate 는 엔티티와 대조만 한다
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  jackson:
    mapper:
      # purpose 를 "post" 처럼 소문자로 보내도 enum 으로 받는다
      accept-case-insensitive-enums: true

  # 메시지는 JSON 문자열. post.deleted, member.purged 를 구독해 파일을 지운다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: service-media
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 사진 저장소. db: 로컬·테스트용(파일을 DB 에 두고 이 서비스가 업로드·조회를 받음) / r2: 운영(Cloudflare R2)
# 사진 URL = public-base-url + "/" + imageKey (운영은 R2 버킷에 연결한 커스텀 도메인, 예: https://img.ijiri.net)
storage:
  type: ${STORAGE_TYPE:db}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL}
