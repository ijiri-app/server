# PR 은 테스트만 돌린다. 머지는 PR 의 test 통과와 최신 브랜치가 필수라(브랜치 보호) push 에서는 다시 테스트하지 않고,
# 서비스 4개의 이미지 빌드(GHCR)만 하며 main 은 서버에 배포까지 한다.
# 서버는 Cloudflare Tunnel 뒤에 있어 밖에서 SSH 로 들어갈 수 없으므로, 서버에 설치한 self-hosted runner 가 배포한다.
name: CI/CD

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/server

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 기본값은 main 에서만 캐시를 저장한다. PR 도 저장해야 같은 PR 의 다음 push 가 테스트 의존성과
      # 임베디드 PostgreSQL 바이너리를 다시 받지 않는다 (develop/main push 는 bootJar 만 돌려 테스트 의존성이 없다)
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 모듈마다 임베디드 PostgreSQL 로 돌아서 Docker 가 필요 없다
      - name: Test
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test'

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Gradle 캐시를 쓰도록 이미지 밖에서 빌드하고 jar 만 담는다. 모듈 jar 를 한 디렉터리에 모아 컨텍스트로 쓴다
      - name: Build jars
        run: |
          ./gradlew bootJar
          mkdir -p build/jars
          cp service-*/build/libs/*-SNAPSHOT.jar build/jars/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 서비스마다 브랜치 이름 태그(develop, main)와 커밋 SHA 태그를 함께 붙인다. 되돌릴 때는 SHA 태그로 띄운다
      - name: Build and push images
        run: |
          for module in service-user service-community service-car service-media; do
            name=${module#service-}
            docker buildx build build/jars \
              --file Dockerfile --target ci --build-arg MODULE="$module" --push \
              --tag "$IMAGE-$name:${{ github.ref_name }}" \
              --tag "$IMAGE-$name:sha-${{ github.sha }}" \
              --cache-from "type=gha,scope=$name" --cache-to "type=gha,scope=$name,mode=max"
          done

  deploy:
    needs: build
    # 서버에 runner 를 설치하고 저장소 변수 DEPLOY_ENABLED 를 true 로 두기 전까지는 건너뛴다
    # (runner 가 없으면 작업이 대기하다 실패한다)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # 서버에 설치한 runner (라벨 ijiri-server)
    runs-on: [self-hosted, ijiri-server]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .env, DB 볼륨, 서비스 중인 색(nginx/upstream.conf)은 서버의 DEPLOY_DIR 에 두고 배포 파일만 최신으로 덮어쓴다.
      # deploy.sh 가 쉬는 색에 새 버전을 띄우고, 모두 응답하면 nginx 를 돌린다. 뜨지 못하면 배포를 실패로 표시한다
      - name: Deploy (blue/green)
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR repository variable is not set"; exit 1; }
          mkdir -p "$DEPLOY_DIR/nginx"
          cp docker-compose.yml deploy.sh "$DEPLOY_DIR/"
          cp nginx/default.conf nginx/proxy.inc "$DEPLOY_DIR/nginx/"
          "$DEPLOY_DIR/deploy.sh" "$IMAGE_TAG"
