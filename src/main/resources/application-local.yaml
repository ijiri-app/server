spring:
  jpa:
    show-sql: true

# 로컬 전용 값. 운영(prod)에서는 환경 변수가 없으면 기동에 실패한다
jwt:
  secret: ${JWT_SECRET:ijiri-local-test-secret-key-0123456789abcdef}

oauth:
  kakao:
    admin-key: ${KAKAO_ADMIN_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/images}
  db:
    # DB 저장소가 발급하는 업로드 URL 의 앞부분 (이 서버 주소)
    server-url: ${STORAGE_DB_SERVER_URL:http://localhost:8080}
